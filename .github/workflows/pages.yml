# 部署「时习 · 论语日课」(qian_v2/) 到 GitHub Pages
# 站点：https://xuemanqingsong.github.io/lunyu-tool/
# 触发：推送 main 分支（qian_v2/ 有改动时自动更新线上）
name: Deploy qian_v2 to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - 'qian_v2/**'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Pages
        uses: actions/configure-pages@v5
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: qian_v2
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
