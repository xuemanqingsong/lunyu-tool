<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>时习论语日课</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: -apple-system, "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
    background: #faf6ee;
    color: #3a3226;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 48px 20px 60px;
  }
  .container { max-width: 480px; width: 100%; text-align: center; }
  .brand { font-size: 26px; letter-spacing: 6px; color: #3a3226; font-weight: 600; }
  .subtitle { font-size: 13px; color: #b0a48c; margin-top: 10px; letter-spacing: 1px; line-height: 1.8; }
  .date-line { font-size: 12px; color: #c4b9a0; margin: 14px 0 36px; letter-spacing: 1px; }

  .entry-card {
    display: block;
    background: #fffdf7; border: 1px solid #e5dcc8; border-radius: 16px;
    padding: 26px 24px; margin-bottom: 18px; text-decoration: none; color: inherit;
    box-shadow: 0 3px 12px rgba(0,0,0,0.05);
    transition: all .15s;
  }
  .entry-card:hover { border-color: #c9b98e; transform: translateY(-1px); box-shadow: 0 6px 18px rgba(0,0,0,0.08); }
  .entry-card .e-name { font-size: 18px; font-weight: 600; letter-spacing: 2px; color: #3a3226; }
  .entry-card .e-badge {
    display: inline-block; font-size: 11px; color: #8a3d2b;
    border: 1px solid #c9a98a; border-radius: 10px; padding: 1px 8px;
    margin-left: 8px; vertical-align: 2px; letter-spacing: 1px;
  }
  .entry-card .e-desc { font-size: 13px; color: #8a7a5c; margin-top: 10px; line-height: 1.8; }

  .footer { margin-top: 20px; font-size: 11px; color: #c4b9a0; letter-spacing: 1px; }
</style>
</head>
<body>
<div class="container">
  <div class="brand">时习论语日课</div>
  <div class="subtitle">每天学一句，把论语活进今天的生活</div>
  <div class="date-line" id="dateLine"></div>

  <a class="entry-card" href="v2/">
    <span class="e-name">时习论语日课 · 情境版</span><span class="e-badge">新</span>
    <div class="e-desc">抽一组生活情境，挑中「这就是我」的那个，看对应的一句论语和今天的行动。</div>
  </a>

  <a class="entry-card" href="qian_v2/">
    <span class="e-name">时习 · 论语日课 · 每日一句</span>
    <div class="e-desc">每天一句论语，先自己琢磨它和你今天的关联，再看讲解，做一件今日一试的小事。</div>
  </a>

  <a class="entry-card" href="jinang.html">
    <span class="e-name">论语锦囊 · 摇一摇</span>
    <div class="e-desc">想三个词，看两千五百年前的话语如何回应你（旧版）。</div>
  </a>

  <div class="footer">学而时习之，不亦说乎</div>
</div>

<script>
  const d = new Date();
  const wd = ["周日","周一","周二","周三","周四","周五","周六"][d.getDay()];
  document.getElementById("dateLine").textContent = d.getFullYear() + "年" + (d.getMonth()+1) + "月" + d.getDate() + "日 · " + wd;
</script>
</body>
</html>
